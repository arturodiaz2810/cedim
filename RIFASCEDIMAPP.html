<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Rifas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        .seller-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 1rem;
            margin: 1rem 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .seller-card h3 {
            margin: 0 0 0.5rem;
        }

        .seller-card ul {
            list-style: none;
            padding: 0;
        }

        .seller-card li {
            margin: 0.5rem 0;
            display: flex;
            justify-content: space-between;
        }

        .seller-card button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
        }

        .seller-card button:hover {
            background-color: #45a049;
        }

        @media (max-width: 768px) {
            .seller-card {
                margin: 1rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Gestión de Rifas</h1>
    </header>
    <div class="container">
        <div id="seller-list"></div>
    </div>

    <script>
        const sellers = Array.from({ length: 10 }, (_, i) => ({
            id: i + 1,
            name: `Vendedor ${i + 1}`,
            tickets: Array.from({ length: 10 }, (_, j) => ({
                number: i * 10 + j + 1,
                sold: false
            }))
        }));

        const sellerList = document.getElementById('seller-list');

        function renderSellers() {
            sellerList.innerHTML = '';
            sellers.forEach(seller => {
                const card = document.createElement('div');
                card.className = 'seller-card';

                const ticketList = seller.tickets.map(ticket => `
                    <li>
                        Ticket #${ticket.number}
                        <button onclick="toggleTicket(${seller.id}, ${ticket.number})">
                            ${ticket.sold ? 'Desmarcar' : 'Vender'}
                        </button>
                    </li>
                `).join('');

                card.innerHTML = `
                    <h3>${seller.name}</h3>
                    <ul>${ticketList}</ul>
                `;

                sellerList.appendChild(card);
            });
        }

        function toggleTicket(sellerId, ticketNumber) {
            const seller = sellers.find(s => s.id === sellerId);
            const ticket = seller.tickets.find(t => t.number === ticketNumber);
            ticket.sold = !ticket.sold;
            renderSellers();
        }

        renderSellers();
    </script>
</body>
</html>
